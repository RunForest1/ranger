name: CI

# Проверка из раздела 8 CLAUDE.md (типы, линт, сборка) на каждый push и PR.
# Ничего не деплоит: хаб разворачивается на своём сервере через docker compose (README).

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Backend — Prisma client
              working-directory: apps/backend
              run: bunx prisma generate

            - name: Backend — lint
              working-directory: apps/backend
              run: bun run lint

            - name: Backend — build
              working-directory: apps/backend
              run: bun run build

            - name: Frontend — lint
              working-directory: apps/frontend
              run: bun run lint

            - name: Frontend — build
              working-directory: apps/frontend
              run: bun run build

    docker:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Build backend image
              run: docker build -f apps/backend/Dockerfile .

            - name: Build frontend image
              run: docker build apps/frontend

            # Этот образ backend собирает сам на первом старте (ensureImage) — здесь
            # только проверяем, что Dockerfile не сломан, чтобы не узнать об этом на сервере.
            - name: Build builder image
              run: docker build -f apps/backend/docker/builder.Dockerfile apps/backend/docker
